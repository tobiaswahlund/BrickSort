name: CI

# Lint and test on every push and pull request. The tests need no GPU, torch or MuJoCo,
# so only numpy and Pillow are installed and a run takes well under a minute.
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install numpy pillow pytest ruff
      - run: ruff check .
      - run: pytest -q
