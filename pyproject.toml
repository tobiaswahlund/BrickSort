[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bricksort"
version = "0.1.0"
description = "Recognise LEGO parts from a camera picture and sort them on a simulated conveyor belt."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # 2.6+ loads model files safely (weights_only); older versions can run code from a tampered file
    "torch>=2.6",
    "torchvision",
    # scene.py relies on MuJoCo details that can change between major versions
    "mujoco>=3.2,<4",
    "numpy",
    "pillow",
]

[project.gui-scripts]
bricksort-demo = "bricksort.demo:run"
bricksort-sorter = "bricksort.conveyor_demo:run"
bricksort-training = "bricksort.training_app:run"

[tool.setuptools.packages.find]
include = ["bricksort*"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["my_photos", "corrections", "_check", "model", "reference"]

[tool.ruff.lint]
# real mistakes (undefined names, unused imports and variables, bare syntax slips), bug patterns, import order
select = ["E4", "E7", "E9", "F", "B", "I"]
# zip(strict=) everywhere and no small lambdas would add noise, not safety
ignore = ["B905", "E731"]
